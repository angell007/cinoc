allow_url_fopen = Off
allow_url_include = Off
display_errors = On
enable_dl = On
file_uploads = On
max_execution_time = 1000
max_input_time = 2000
max_input_vars = 10000
memory_limit = -1
post_max_size = 800M
session.gc_maxlifetime = 1440
session.save_path = "/var/cpanel/php/sessions/ea-php74"
upload_max_filesize = 100M
zlib.output_compression = On
